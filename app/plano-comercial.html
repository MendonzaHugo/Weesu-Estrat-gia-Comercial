<style>

:root{

  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F151B; --surface:#172029; --ink:#E7EDF2; --muted:#9BA8B4; --line:#2B3743; --soft:#1F2A34;

  --good:#63C892; --good-soft:#173527; --warn:#E5A84C; --warn-soft:#3A2C12; --crit:#F0837A; --crit-soft:#40201D;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9580ff; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F151B; --surface:#172029; --ink:#E7EDF2; --muted:#9BA8B4; --line:#2B3743; --soft:#1F2A34;
  --accent:#55C4C0; --accent-soft:#16383B; --on-accent:#0B1A1C;
  --good:#63C892; --good-soft:#173527; --warn:#E5A84C; --warn-soft:#3A2C12; --crit:#F0837A; --crit-soft:#40201D;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9580ff; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
h1,h2,h3,h4,p,ul,ol{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700;font-stretch:90%}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--mono);font-size:12px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:12px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.brand h1{font-family:var(--display);font-weight:800;font-stretch:88%;font-size:22px;line-height:1.1}
.brand h1 span{color:var(--accent)}
.brand p{font-size:12.5px;color:var(--muted)}
.blocos{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.bloco{display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 12px 9px;font:inherit;font-size:14.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px;flex:none}
.bloco b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--soft);color:var(--muted);font-size:11.5px}
.bloco:hover{color:var(--ink)}
.bloco[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.bloco[aria-pressed="true"] b{background:var(--accent);color:var(--on-accent)}
.bloco .sm{display:none}
@media (max-width:520px){.blocos{gap:0}.bloco{padding:6px 6px 9px;font-size:13.5px;gap:5px}.bloco b{width:18px;height:18px;font-size:11px}.bloco .lg{display:none}.bloco .sm{display:inline}}
.bloco.extra{margin-left:auto;font-weight:500;font-size:13.5px}
@media (max-width:420px){.bloco b{display:none}}
.proxima{display:flex;justify-content:flex-end;margin-top:20px}
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;flex:none}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.wrap{max-width:1120px;width:100%;margin:0 auto;padding-inline:20px;padding-block:24px 56px;display:flex;flex-direction:column;gap:18px}
.sec-head{display:flex;flex-direction:column;gap:8px;max-width:78ch}
.sec-head h2{font-family:var(--display);font-weight:800;font-stretch:88%;font-size:clamp(24px,4vw,32px);line-height:1.08;text-wrap:balance}
.sec-head p{font-size:15.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;min-width:0;display:flex;flex-direction:column;gap:14px}
.card>h3{font-family:var(--display);font-weight:700;font-size:17px;text-wrap:balance}
.card>h3 small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted);margin-left:6px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tile{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile .num{font-size:clamp(22px,3vw,28px);line-height:1.1}
.tile .note{font-size:12.5px;color:var(--muted)}

.callout{border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;background:var(--accent-soft)}
.callout.warn{background:var(--warn-soft)}
.callout.crit{background:var(--crit-soft)}
.callout h4{font-family:var(--display);font-weight:700;font-size:16px}
.callout p{font-size:14px}
.insights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

.scroll{overflow-x:auto;min-width:0}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.t th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 10px 8px 0;white-space:nowrap;vertical-align:bottom}
.t td{padding:8px 10px 8px 0;border-top:1px solid var(--line);vertical-align:top}
.t td.r,.t th.r{text-align:right}
.t tr.tot td{font-weight:600;border-top:2px solid var(--line)}
.t tr.dim td{color:var(--muted)}
.t .neg{color:var(--crit);font-weight:600}
.t .pos{color:var(--good);font-weight:600}
.t small{display:block;color:var(--muted);font-size:12px}

.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--body);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--muted);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend i.line{height:2px;width:16px;border-radius:0}
.legend i.dash{height:0;width:16px;border-top:2px dashed var(--ink);border-radius:0}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 16px rgba(0,0,0,.12);max-width:260px}
.tip b{display:block;margin-bottom:4px}
.tip div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}

.person{display:flex;flex-direction:column;gap:10px}
.person h4{font-family:var(--display);font-weight:700;font-size:17px}
.kv{display:flex;flex-direction:column}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.kv div span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.ramp{display:grid;grid-template-columns:120px repeat(12,minmax(0,1fr));gap:3px;align-items:center;font-size:12px}
.ramp .c{height:22px;border-radius:2px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-variant-numeric:tabular-nums;color:var(--ink)}
.ramp .h{font-size:10.5px;color:var(--muted);text-align:center}

.horiz{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.hz{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hz header{display:flex;flex-direction:column;gap:2px}
.hz h3{font-family:var(--display);font-weight:800;font-stretch:90%;font-size:19px}
.hz .goal{font-size:13px;background:var(--accent-soft);border-radius:4px;padding:8px 10px}
.acts{display:flex;flex-direction:column;gap:2px;list-style:none;padding:0}
.act{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.act input{margin:2px 0 0;width:16px;height:16px;accent-color:var(--accent)}
.act .who{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.act.done .txt{text-decoration:line-through;color:var(--muted)}
.prog{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}

.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{padding:7px 9px;border:1px solid var(--line);border-radius:4px;background:var(--bg);width:100%;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:baseline}
.t.nw td.r{white-space:nowrap}
.t input.cn{width:88px;padding:5px 7px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:inherit;font:inherit;text-align:right;font-variant-numeric:tabular-nums}
.field small{font-size:11.5px;color:var(--muted)}
.fgroup{display:flex;flex-direction:column;gap:10px}
.fgroup>h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:4px;padding:8px 16px;font-weight:600;font-size:14px;cursor:pointer}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.status{font-size:13px;color:var(--muted)}
.empty{padding:20px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);font-size:14px;text-align:center}
select.inl,input.inl{padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);font-size:13px;max-width:140px}

.gaps{display:flex;flex-direction:column;gap:12px}
.gap{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}

.gap .ctl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start}

.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{border:1px solid var(--line);border-radius:4px;padding:2px 7px;font-size:12px;font-weight:600}

.funnel{display:flex;flex-direction:column;gap:6px}
.fn{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13px}
.fn .trk{height:20px;background:var(--soft);border-radius:3px;overflow:hidden}
.fn .trk i{display:block;height:100%;background:var(--accent)}
.fn .num{text-align:right;font-size:15px}

.refs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ref{border-top:1px solid var(--line);padding-top:10px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.ref b{font-weight:600}
a{color:var(--accent)}
footer{font-size:12.5px;color:var(--muted)}

@media (max-width:900px){

  .insights,.cols3{grid-template-columns:minmax(0,1fr)}

}
@media (max-width:760px){
  .cols,.gap,.refs{grid-template-columns:minmax(0,1fr)}

  .ramp{grid-template-columns:72px repeat(12,minmax(0,1fr))}
}

  .horiz,.form{grid-template-columns:minmax(0,1fr)}

}

.hero{display:flex;flex-direction:column;gap:12px;max-width:80ch;padding-block:8px}
.hero h2{font-family:var(--display);font-weight:800;font-stretch:88%;font-size:clamp(28px,5vw,42px);line-height:1.04;text-wrap:balance}
.hero h2 span{color:var(--accent)}
.hero p{font-size:16.5px}
.mixbar{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--soft);min-width:120px;gap:2px}
.mixbar i{display:block;height:100%}
.focos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.foco{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.foco.star{grid-column:span 2;border:2px solid var(--accent)}
.foco.opt{border-style:dashed;background:transparent}
.foco h4{font-family:var(--display);font-weight:700;font-size:16.5px;display:flex;gap:8px;align-items:center}
.foco h4 i{width:10px;height:10px;border-radius:2px;flex:none}
.foco p{font-size:13.5px}
.foco .kv div{font-size:13px}
.vs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.vs>div{background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.vs>div.hi{background:var(--accent-soft)}
.vs h4{font-family:var(--display);font-weight:700;font-size:16px}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.steps>div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.steps .num{font-size:20px}
.steps .note{font-size:12px;color:var(--muted)}
@media (max-width:900px){.focos{grid-template-columns:repeat(2,minmax(0,1fr))}.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.focos,.vs{grid-template-columns:minmax(0,1fr)}.foco.star{grid-column:auto}}
</style>

function brl(v,dec){ if(v==null||isNaN(v)) return '—'; return (v<0?'−':'')+'R$ '+Math.abs(Number(v)).toLocaleString('pt-BR',{minimumFractionDigits:dec||0,maximumFractionDigits:dec||0}); }
function k(v){ if(v==null||isNaN(v)) return '—'; var a=Math.abs(v), s=v<0?'−':''; if(a>=1e6) return s+'R$ '+(a/1e6).toLocaleString('pt-BR',{maximumFractionDigits:a>=1e8?0:1})+' mi'; if(a>=1e3) return s+'R$ '+(a/1e3).toLocaleString('pt-BR',{maximumFractionDigits:a>=1e5?0:1})+' mil'; return brl(v); }
function pct(v,d){ if(v==null||isNaN(v)||!isFinite(v)) return '—'; return (v*100).toLocaleString('pt-BR',{maximumFractionDigits:d==null?1:d})+'%'; }
function nf(v,d){ if(v==null||isNaN(v)) return '—'; return Number(v).toLocaleString('pt-BR',{maximumFractionDigits:d==null?1:d}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

function arr5(s){ var a=String(s||'').split(/[,;\s]+/).map(Number).filter(function(x){return !isNaN(x);}); while(a.length<5) a.push(a.length?a[a.length-1]:1); return a.slice(0,5); }

/* ---------- fechamentos anteriores ao plano (status ganho, mês antes de nov/26) ---------- */
function preplano(){
  var it=S.pipeline.filter(function(d){ return d.status==='ganho'&&d.mes&&d.mes<MESES[0]; }).sort(function(a,b){ return (+b.mrr||0)-(+a.mrr||0); });
  var R={itens:it,total:0,extra:0,extraCli:0,dir:0,ind:0,setup:0,meses:0};
  it.forEach(function(d){ var v=+d.mrr||0; R.total+=v; R.setup+=+d.setup||0; if(d.origem==='puro') R.ind+=v; else R.dir+=v; if(!d.noMrrInicial){ R.extra+=v; if(!d.upsell) R.extraCli++; } });
  if(it.length){ var m0=it.map(function(d){return d.mes;}).sort()[0], y=+m0.slice(0,4), mo=+m0.slice(5,7); R.meses=(2026-y)*12+(11-mo)-1; R.mesFech=m0; }
  R.recMes=S.prem.revDireta*R.dir+S.prem.revIndicacao*R.ind;
  return R;
}

function mesNome(m){ var n=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez']; return n[+m.slice(5,7)-1]+'/'+m.slice(2,4); }

/* ---------- modelo ---------- */
function modelo(pp){
  var p=pp||S.prem, M={}, N=(pp&&pp.__N)||60;
  var hcS=arr5(p.hcSdr), hcC=arr5(p.hcCloser), hcE=arr5(p.hcExec), cres=[p.cresc1,p.cresc2,p.cresc3,p.cresc4,p.cresc5];
  // ano 1: capacidade por canal
  var cap={pipe:[],base:[],cli:[],contab:[],ecom:[],erp:[],inb:[]}, reun=[];
  for(var m=0;m<12;m++){
    var pipe=0, puro=0; S.pipeline.forEach(function(d){ if(d.status==='aberto'&&d.mes===MESES[m]){ var w=(+d.mrr||0)*(+d.prob||0); if(d.origem==='puro') puro+=w; else pipe+=w; } });
    cap.pipe.push(pipe);
    reun.push(p.reunioesSdrPlena*RAMP_SDR[m]*hcS[0]);
    cap.base.push((m>0? reun[m-1]*p.convReuniaoVenda*p.ticketLow : 0)+(m>0? FRANQ[m-1]*1*p.convIndicacao*p.ticketLow : 0));
    cap.cli.push(CLIENTES[m]*p.ticketLow);
    cap.contab.push(m>0? CONTAB[m-1]*0.3*p.convIndicacao*p.ticketLow : 0);
    var mxRest=(MX.semConvite*p.mxRespPres+(MX.semResposta+MX.semContato)*p.mxResposta*p.mxRespPres)*p.mxFechamento*p.mxTicket;
    var mxDist=[0,0.4,0.4,0.2,0,0,0,0,0,0,0,0];
    cap.ecom.push(puro+mxRest*mxDist[m]+(m>0? ECOM[m-1]*p.convEcom*p.ticketLow : 0));
    cap.erp.push(m>1? ERPS[m-2]*0.5*p.convErp*p.ticketHigh : 0);
    cap.inb.push(INBOUND[m]*p.convInbound*p.ticketLow);
  }
  M.cap=cap; M.capTot=MESES.map(function(_,i){ return cap.pipe[i]+cap.base[i]+cap.cli[i]+cap.contab[i]+cap.ecom[i]+cap.erp[i]+cap.inb[i]; });
  // 60 meses
  var K=['meta','ind','hi','deals','mrr','cli','churnR','mrrD','mrrI','rev','comParc','custoFixo','custoVar','custo','cotas','caixa','acum','weesuLiq','setup','reun'];
  K.forEach(function(x){M[x]=[];});
  var PP=preplano(), meta=p.metaM1, mrr=p.mrrInicial+PP.extra, cli=p.clientesIniciais+PP.extraCli, mD=PP.dir, mI=PP.ind, acum=0;
  for(var t=0;t<N;t++){
    var y=Math.floor(t/12), yi=Math.min(4,y);
    if(t>0) meta=meta*(1+cres[yi]);
    var ind,hi;
    if(t<12){ var ct=M.capTot[t]; ind= ct>0? (cap.cli[t]+cap.contab[t]+cap.ecom[t])/ct : 0; hi= ct>0? cap.erp[t]/ct : 0; }
    else { ind=p.shareInd; hi=p.shareHigh; }
    var deals=meta*(1-hi)/p.ticketLow+meta*hi/p.ticketHigh;
    var ch=mrr*p.churn; mrr=mrr-ch+meta; cli=cli*(1-p.churn)+deals;
    mD=mD*(1-p.churn)+meta*(1-ind); mI=mI*(1-p.churn)+meta*ind;
    var dr=p.revDireta, ir=p.revIndicacao; if(p.sched){ var sc=p.sched(t); dr=sc[0]; ir=sc[1]; }
    var rev= (t<p.vigenciaMeses ? dr*mD+ir*mI : 0) + (p.bonusPrimeira||0)*meta + (p.setupDixx||0)*deals*p.setupMedio;
    var comP=p.comissaoParceiro*mI;
    var inf=Math.pow(1+p.reajuste,y);
    var fixo=(hcS[yi]*p.sdrBase+hcC[yi]*p.closerBase+hcE[yi]*p.execBase)*inf*p.fatorEncargos;
    var rn= t<12? reun[t] : p.reunioesSdrPlena*hcS[yi];
    var execV=p.execPctNmrrInd*meta*ind; if(t<3) execV=Math.max(execV,p.execGarantia);
    var vari= p.comissaoInclusa ? 0 : (p.sdrPorReuniao*rn+p.closerPctNmrr*meta+execV)*p.fatorEncargos;
    var cot= t<p.prazoCotasMeses ? p.valuation*p.equityPct*p.pagaCotas/p.prazoCotasMeses : 0;
    var custo=fixo+vari, caixa=rev-custo-cot; acum+=caixa; M.cotas.push(cot);
    M.meta.push(meta); M.ind.push(ind); M.hi.push(hi); M.deals.push(deals); M.mrr.push(mrr); M.cli.push(cli); M.churnR.push(ch);
    M.mrrD.push(mD); M.mrrI.push(mI); M.rev.push(rev); M.comParc.push(comP); M.custoFixo.push(fixo); M.custoVar.push(vari); M.custo.push(custo);
    M.caixa.push(caixa); M.acum.push(acum); M.weesuLiq.push(mD+mI-rev-comP); M.setup.push(deals*p.setupMedio); M.reun.push(rn);
  }
  M.mult=p.valuation/(p.mrrInicial*12);
  M.anos=[0,1,2,3,4].map(function(y){
    var a=y*12,b=a+12, sl=function(x){return M[x].slice(a,b);};
    var mrrF=M.mrr[b-1], val=mrrF*12*M.mult, eq=p.equityPct*Math.min(1,(y+1)/p.anosVesting);
    return {nmrr:sum(sl('meta')),deals:sum(sl('deals')),mrr:mrrF,cli:M.cli[b-1],arr:mrrF*12,val:val,eqPct:eq,eqVal:eq*val,eqHoje:eq*p.valuation,
      rev:sum(sl('rev')),custo:sum(sl('custo')),cotas:sum(sl('cotas')),caixa:sum(sl('caixa')),acum:M.acum[b-1],comParc:sum(sl('comParc')),setup:sum(sl('setup')),
      ind:sum(M.meta.slice(a,b).map(function(v,i){return v*M.ind[a+i];}))/sum(sl('meta')),
      ticket:sum(sl('meta'))/sum(sl('deals')),hc:hcS[y]+hcC[y]+hcE[y],weesu:sum(sl('weesuLiq')),novoMrr:M.mrrD[b-1]+M.mrrI[b-1]};
  });
  var pico=Math.min.apply(null,M.acum), be=-1; for(var i=0;i<N;i++){ if(M.caixa[i]>=0){ be=i; break; } }
  var beAc=-1; for(var j=0;j<N;j++){ if(M.acum[j]>=0&&j>0&&M.acum[j-1]<0){ beAc=j; } }
  M.pico=pico; M.picoMes=M.acum.indexOf(pico); M.breakEven=be; M.payBackAcum=beAc;
  M.cotasTot=sum(M.cotas); M.custoTot=sum(M.custo); M.revTot=sum(M.rev);
  // ano 1 resumo (compatível com as seções anteriores)
  var d1=sum(M.deals.slice(0,12)), c1=sum(M.custo.slice(0,12));
  M.cac=c1/d1; M.cacBruto=M.cac;
  return M;
}

function chartStack(o){
  var W=720,H=280,L=72,R=12,T=14,B=30, n=o.labels.length;

function simCanais(){
  var p=S.prem, cfg=cnPrem(), D=projDez(), M=D.M, N=120, ini=99;

    for(var t=0;t<N;t++){
      var y=Math.floor(t/12), n=0;
      if(y+1>=tp.inicio){ n=tp.abre*Math.pow(1+tp.cresc,y+1-tp.inicio)/12; }
      coh.push(n); ab+=n;
      var at=0, nm=0;
      for(var s=0;s<=t;s++){ if(!coh[s]) continue; var a=t-s, vivo=coh[s]*Math.pow(sob,a); at+=vivo; nm+=vivo*tp.prod*Math.min(1,(a+1)/Math.max(1,tp.ramp)); }

      R.ativos.push(at); R.abertas.push(ab); R.nmrr.push(nm); R.mrr.push(mrr); R.rep.push(mrr*tp.rep);

    var np=Object.assign({},S.prem,{canaisNovos:{estrutura:cfg.estrutura,tipos:cfg.tipos.map(function(x){return {id:x.id,inicio:x.inicio,abre:x.abre,cresc:x.cresc,prod:x.prod,ramp:x.ramp,inat:x.inat,rep:x.rep};})}}); S.prem=np; render(); setStatus('cnStatus','Salvando…'); salvar('config/premissas',np,'cnStatus','Premissas dos canais salvas.'); }
  if(t.id==='cnPadrao'){ var np2=Object.assign({},S.prem); delete np2.canaisNovos; S.prem=np2; render(); salvar('config/premissas',np2,'cnStatus','Premissas dos canais de volta ao padrão.'); }
  if(t.id==='premPadrao'){ S.prem=Object.assign({},DEF); render(); salvar('config/premissas',S.prem,'premStatus','Premissas de volta ao padrão.'); }
  if(t.id==='rzSalvar'){ var r={}; document.querySelectorAll('[data-rz]').forEach(function(i){ if(i.value!=='') r[i.getAttribute('data-rz')]=parseFloat(i.value); }); var nt=el('rz-nota').value; if(nt) r.nota=nt; S.realizado[mesSel]=r; var m=mesSel; render(); setStatus('rzStatus','Salvando…'); salvar('realizado/'+m,r,'rzStatus',ROT[MESES.indexOf(m)]+' salvo.'); }
});

(async function(){
  var cl=window.claude; if(!cl||!cl.use){ S.loaded.pipeline=true; render(); return; }
  var db=null,user=null;
  try{ db=await cl.use('db'); }catch(e){}
  try{ user=await cl.use('user'); }catch(e){}
  if(!db){ S.loaded.pipeline=true; render(); return; }
  S.db=db;
  var cw=null; try{ cw=user? await user.can('data.write') : null; }catch(e){}
  S.canWrite = cw!==false;
  db.doc('config/premissas').onSnapshot(function(s){ S.prem=Object.assign({},DEF,s.exists?s.data():{}); render(); },function(){ render(); });
  db.collection('pipeline').onSnapshot(function(s){ S.pipeline=s.docs.map(function(d){ return Object.assign({id:d.id},d.data()); }); S.loaded.pipeline=true; render(); },function(){ S.loaded.pipeline=true; render(); });
  db.collection('realizado').onSnapshot(function(s){ var r={}; s.docs.forEach(function(d){ r[d.id]=d.data(); }); S.realizado=r; render(); },function(){ render(); });
  db.collection('acoes').onSnapshot(function(s){ var r={}; s.docs.forEach(function(d){ r[d.id]=d.data(); }); S.acoes=r; render(); },function(){ render(); });
  db.collection('wms').onSnapshot(function(s){ var r={}; s.docs.forEach(function(d){ r[d.id]=d.data(); }); S.wms=r; render(); },function(){ render(); });
})();
})();
