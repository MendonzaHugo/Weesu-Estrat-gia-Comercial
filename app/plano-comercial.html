<title>Plano Comercial Weesu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@87.5..112,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: barra fixa com as seções do plano; cada seção abre com a conclusão (resumo antes do detalhe), depois quadros, gráficos e tabelas. Mesma identidade da Carteira Comercial Weesu. */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#15202B; --muted:#586674; --line:#D8DFE6; --soft:#E9EEF2;
  --accent:#0A6C74; --accent-soft:#D9EEF0; --on-accent:#FFFFFF;
  --good:#1B7A4B; --good-soft:#DDF1E6; --warn:#9A5B00; --warn-soft:#FBEBD0; --crit:#AE3329; --crit-soft:#F8DEDB;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F151B; --surface:#172029; --ink:#E7EDF2; --muted:#9BA8B4; --line:#2B3743; --soft:#1F2A34;
  --accent:#55C4C0; --accent-soft:#16383B; --on-accent:#0B1A1C;
  --good:#63C892; --good-soft:#173527; --warn:#E5A84C; --warn-soft:#3A2C12; --crit:#F0837A; --crit-soft:#40201D;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F151B; --surface:#172029; --ink:#E7EDF2; --muted:#9BA8B4; --line:#2B3743; --soft:#1F2A34;
  --accent:#55C4C0; --accent-soft:#16383B; --on-accent:#0B1A1C;
  --good:#63C892; --good-soft:#173527; --warn:#E5A84C; --warn-soft:#3A2C12; --crit:#F0837A; --crit-soft:#40201D;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
h1,h2,h3,h4,p,ul,ol{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700;font-stretch:90%}
.label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--mono);font-size:12px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:12px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.brand h1{font-family:var(--display);font-weight:800;font-stretch:88%;font-size:22px;line-height:1.1}
.brand h1 span{color:var(--accent)}
.brand p{font-size:12.5px;color:var(--muted)}
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;flex:none}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.wrap{max-width:1120px;width:100%;margin:0 auto;padding-inline:20px;padding-block:24px 56px;display:flex;flex-direction:column;gap:18px}
.sec-head{display:flex;flex-direction:column;gap:8px;max-width:78ch}
.sec-head h2{font-family:var(--display);font-weight:800;font-stretch:88%;font-size:clamp(24px,4vw,32px);line-height:1.08;text-wrap:balance}
.sec-head p{font-size:15.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;min-width:0;display:flex;flex-direction:column;gap:14px}
.card>h3{font-family:var(--display);font-weight:700;font-size:17px;text-wrap:balance}
.card>h3 small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted);margin-left:6px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tile{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile .num{font-size:clamp(22px,3vw,28px);line-height:1.1}
.tile .note{font-size:12.5px;color:var(--muted)}

.callout{border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;background:var(--accent-soft)}
.callout.warn{background:var(--warn-soft)}
.callout.crit{background:var(--crit-soft)}
.callout h4{font-family:var(--display);font-weight:700;font-size:16px}
.callout p{font-size:14px}
.insights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

.scroll{overflow-x:auto;min-width:0}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.t th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 10px 8px 0;white-space:nowrap;vertical-align:bottom}
.t td{padding:8px 10px 8px 0;border-top:1px solid var(--line);vertical-align:top}
.t td.r,.t th.r{text-align:right}
.t tr.tot td{font-weight:600;border-top:2px solid var(--line)}
.t tr.dim td{color:var(--muted)}
.t .neg{color:var(--crit);font-weight:600}
.t .pos{color:var(--good);font-weight:600}
.t small{display:block;color:var(--muted);font-size:12px}

.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--body);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--muted);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend i.line{height:2px;width:16px;border-radius:0}
.legend i.dash{height:0;width:16px;border-top:2px dashed var(--ink);border-radius:0}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 16px rgba(0,0,0,.12);max-width:260px}
.tip b{display:block;margin-bottom:4px}
.tip div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}

.person{display:flex;flex-direction:column;gap:10px}
.person h4{font-family:var(--display);font-weight:700;font-size:17px}
.kv{display:flex;flex-direction:column}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.kv div span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.ramp{display:grid;grid-template-columns:120px repeat(12,minmax(0,1fr));gap:3px;align-items:center;font-size:12px}
.ramp .c{height:22px;border-radius:2px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-variant-numeric:tabular-nums;color:var(--ink)}
.ramp .h{font-size:10.5px;color:var(--muted);text-align:center}

.horiz{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.hz{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hz header{display:flex;flex-direction:column;gap:2px}
.hz h3{font-family:var(--display);font-weight:800;font-stretch:90%;font-size:19px}
.hz .goal{font-size:13px;background:var(--accent-soft);border-radius:4px;padding:8px 10px}
.acts{display:flex;flex-direction:column;gap:2px;list-style:none;padding:0}
.act{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.act input{margin:2px 0 0;width:16px;height:16px;accent-color:var(--accent)}
.act .who{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.act.done .txt{text-decoration:line-through;color:var(--muted)}
.prog{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}

.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{padding:7px 9px;border:1px solid var(--line);border-radius:4px;background:var(--bg);width:100%;font-variant-numeric:tabular-nums}
.field small{font-size:11.5px;color:var(--muted)}
.fgroup{display:flex;flex-direction:column;gap:10px}
.fgroup>h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:4px;padding:8px 16px;font-weight:600;font-size:14px;cursor:pointer}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.status{font-size:13px;color:var(--muted)}
.empty{padding:20px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);font-size:14px;text-align:center}
select.inl,input.inl{padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);font-size:13px;max-width:140px}
input.inl{width:70px}

.gaps{display:flex;flex-direction:column;gap:12px}
.gap{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.gap h4{font-family:var(--display);font-weight:700;font-size:16px}
.gap .ev{font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.gap .ctl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start}
.gap .ctl .field:last-child{grid-column:1/-1}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{border:1px solid var(--line);border-radius:4px;padding:2px 7px;font-size:12px;font-weight:600}

.funnel{display:flex;flex-direction:column;gap:6px}
.fn{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13px}
.fn .trk{height:20px;background:var(--soft);border-radius:3px;overflow:hidden}
.fn .trk i{display:block;height:100%;background:var(--accent)}
.fn .num{text-align:right;font-size:15px}

.refs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ref{border-top:1px solid var(--line);padding-top:10px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.ref b{font-weight:600}
a{color:var(--accent)}
footer{font-size:12.5px;color:var(--muted)}

@media (max-width:900px){
  .horiz{grid-template-columns:repeat(2,minmax(0,1fr))}
  .insights,.cols3{grid-template-columns:minmax(0,1fr)}
  .form{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .cols,.gap,.refs{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bar{position:static}
  .ramp{grid-template-columns:72px repeat(12,minmax(0,1fr))}
}
@media (max-width:520px){
  .horiz,.form{grid-template-columns:minmax(0,1fr)}
  .fn{grid-template-columns:minmax(0,1fr) 60px}.fn .trk{grid-column:1/-1;grid-row:2}
}
@media (prefers-reduced-motion:no-preference){.chip{transition:background-color .15s,border-color .15s}}
</style>

<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <h1>Plano Comercial <span>Weesu</span></h1>

    <nav class="nav" id="nav" aria-label="Seções do plano"></nav>
  </div>
</header>
<main id="main"></main>
<div class="tip" id="tip" hidden></div>

function brl(v,dec){ if(v==null||isNaN(v)) return '—'; return 'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:dec||0,maximumFractionDigits:dec||0}); }
function k(v){ if(v==null||isNaN(v)) return '—'; var a=Math.abs(v); if(a>=1e6) return 'R$ '+(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2})+' mi'; if(a>=1e3) return 'R$ '+(v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil'; return brl(v); }
function pct(v,d){ if(v==null||isNaN(v)||!isFinite(v)) return '—'; return (v*100).toLocaleString('pt-BR',{maximumFractionDigits:d==null?1:d})+'%'; }
function nf(v,d){ if(v==null||isNaN(v)) return '—'; return Number(v).toLocaleString('pt-BR',{maximumFractionDigits:d==null?1:d}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function sum(a){ return a.reduce(function(x,y){return x+(+y||0);},0); }

/* ---------- modelo ---------- */
function modelo(){
  var p=S.prem, out={meta:[],deals:[],setup:[],mrr:[],clientes:[],churnR:[],capPipe:[],capSdr:[],capParc:[],capInd:[],cap:[],reunioes:[],parceiros:[],indic:[],
    custoFixo:[],custoVar:[],comParc:[],custo:[],bonusImpl:[],abate:[]};
  var mrr=p.mrrInicial, cli=p.clientesIniciais, mrrParc=0;
  for(var m=0;m<12;m++){
    var meta=p.metaM1*Math.pow(1+p.crescimento,m); out.meta.push(meta);
    var deals=meta/p.ticket; out.deals.push(deals);
    out.setup.push(deals*p.setupMedio);
    var ch=mrr*p.churn; out.churnR.push(ch);
    mrr=mrr-ch+meta; out.mrr.push(mrr);
    cli=cli*(1-p.churn)+deals; out.clientes.push(cli);
    // capacidade por canal
    var pipe=0; S.pipeline.forEach(function(d){ if(d.status==='aberto'&&d.mes===MESES[m]) pipe+=(+d.mrr||0)*(+d.prob||0); });
    out.capPipe.push(pipe);
    var reun=p.reunioesSdrPlena*RAMP_SDR[m]; out.reunioes.push(reun);
    out.capSdr.push(m>0? out.reunioes[m-1]*p.convReuniaoVenda*p.ticket : 0);
    out.parceiros.push(PARCEIROS[m]); var ind=PARCEIROS[m]*p.indicPorParceiro; out.indic.push(ind);
    var parc=m>0? out.indic[m-1]*p.convIndicacao*p.ticket : 0; out.capParc.push(parc);
    var indc=p.vendasIndicClientes*p.ticket; out.capInd.push(indc);
    out.cap.push(pipe+out.capSdr[m]+parc+indc);
    // custos (sobre o cenário de meta; variável pela produção esperada)
    var fixo=(p.sdrBase+p.closerBase+p.execBase)*p.fatorEncargos; out.custoFixo.push(fixo);
    var novosParc=PARCEIROS[m]-(m>0?PARCEIROS[m-1]:0);
    var execVar=Math.max(p.execPctNmrrParceiro*parc+p.execPorParceiro*novosParc, m<3?p.execGarantia:0);
    var vari=(p.sdrPorReuniao*reun+p.closerPctNmrr*meta+execVar)*p.fatorEncargos; out.custoVar.push(vari);
    mrrParc=mrrParc*(1-p.churn)+parc; var cp=mrrParc*p.comissaoParceiro; out.comParc.push(cp);
    out.custo.push(fixo+vari+cp);
    out.bonusImpl.push(out.setup[m]*p.pctBonusImplantacao);
    out.abate.push(out.setup[m]*Math.max(0,1-p.pctImplantacao-p.pctBonusImplantacao));
  }
  var tDeals=sum(out.deals), tCusto=sum(out.custo), tAbate=sum(out.abate);
  out.tot={nmrr:sum(out.meta),deals:tDeals,setup:sum(out.setup),custo:tCusto,abate:tAbate,cap:sum(out.cap),
    cac:(tCusto-tAbate)/tDeals, cacBruto:tCusto/tDeals};
  out.tot.payback=out.tot.cac/(p.ticket*p.margemBruta);
  out.tot.ltv=p.ticket*p.margemBruta/p.churn;
  out.tot.ltvcac=out.tot.ltv/out.tot.cac;
  out.tot.arrAdic=(out.mrr[11]-p.mrrInicial)*12;
  return out;
}

/* ---------- gráficos SVG ---------- */
var tip=el('tip');
function showTip(e,html){ tip.innerHTML=html; tip.hidden=false; var x=e.clientX+14, y=e.clientY+14; var w=tip.offsetWidth, hh=tip.offsetHeight; if(x+w>innerWidth-8) x=e.clientX-w-14; if(y+hh>innerHeight-8) y=e.clientY-hh-14; tip.style.left=x+'px'; tip.style.top=y+'px'; }
function hideTip(){ tip.hidden=true; }
function niceMax(v){ if(v<=0) return 1; var e=Math.pow(10,Math.floor(Math.log10(v))); var n=v/e; var s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10; return s*e; }

function chartStack(o){
  // o: {series:[{nome,cor,vals}], line:{nome,vals}, labels, fmt}
  var W=720,H=280,L=72,R=12,T=14,B=30, n=o.labels.length;
  var tot=o.labels.map(function(_,i){return sum(o.series.map(function(s){return s.vals[i];}));});
  var maxV=niceMax(Math.max.apply(null,tot.concat(o.line?o.line.vals:[]).concat(o.extra?o.extra.vals.filter(function(v){return v!=null;}):[]))*1.05);
  var iw=W-L-R, ih=H-T-B, bw=iw/n, gw=Math.min(36,bw*0.62);
  var y=function(v){return T+ih-(v/maxV)*ih;};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria||'')+'">';
  for(var g=0;g<=4;g++){ var v=maxV*g/4, yy=y(v); s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'"/><text x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end">'+(o.fmtAxis||k)(v)+'</text>'; }
  o.labels.forEach(function(lb,i){
    var x=L+bw*i+(bw-gw)/2, acc=0;
    o.series.forEach(function(se,j){ var v=se.vals[i]; if(v<=0) return; var y1=y(acc+v), y0=y(acc); var hgt=Math.max(0,y0-y1-(acc>0?2:0)); s+='<rect x="'+x+'" y="'+y1+'" width="'+gw+'" height="'+hgt+'" rx="'+(acc+v===tot[i]?3:0)+'" fill="var('+se.cor+')"/>'; acc+=v; });
    s+='<text x="'+(L+bw*i+bw/2)+'" y="'+(H-10)+'" text-anchor="middle">'+lb+'</text>';
  });
  if(o.line){ var pts=o.line.vals.map(function(v,i){return (L+bw*i+bw/2)+','+y(v);}).join(' '); s+='<polyline points="'+pts+'" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 4"/>'; o.line.vals.forEach(function(v,i){ s+='<circle cx="'+(L+bw*i+bw/2)+'" cy="'+y(v)+'" r="3.5" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>'; }); }
  if(o.extra){ o.extra.vals.forEach(function(v,i){ if(v==null) return; s+='<rect x="'+(L+bw*i+bw/2-5)+'" y="'+(y(v)-5)+'" width="10" height="10" transform="rotate(45 '+(L+bw*i+bw/2)+' '+y(v)+')" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>'; }); }
  o.labels.forEach(function(lb,i){ s+='<rect data-i="'+i+'" x="'+(L+bw*i)+'" y="'+T+'" width="'+bw+'" height="'+ih+'" fill="transparent" class="hit"/>'; });
  s+='</svg>';
  return s;
}
function bindChart(box,o){
  box.querySelectorAll('.hit').forEach(function(r){
    r.addEventListener('mousemove',function(e){ var i=+r.getAttribute('data-i'); var h='<b>'+o.labels[i]+'</b>';
      o.series.forEach(function(se){ h+='<div><span>'+se.nome+'</span><span>'+brl(se.vals[i])+'</span></div>'; });
      if(o.series.length>1) h+='<div><span><b style="display:inline">Total</b></span><span>'+brl(sum(o.series.map(function(se){return se.vals[i];})))+'</span></div>';
      if(o.line) h+='<div><span>'+o.line.nome+'</span><span>'+brl(o.line.vals[i])+'</span></div>';
      if(o.extra&&o.extra.vals[i]!=null) h+='<div><span>'+o.extra.nome+'</span><span>'+brl(o.extra.vals[i])+'</span></div>';
      showTip(e,h); });
    r.addEventListener('mouseleave',hideTip);
  });
}
function chartLine(o){
  var W=720,H=240,L=64,R=16,T=14,B=30,n=o.labels.length;
  var all=o.vals.concat(o.real.filter(function(v){return v!=null;}));
  var minV=Math.floor(Math.min.apply(null,[o.base].concat(all))/100000)*100000, maxV=niceMax(Math.max.apply(null,all)*1.04);
  var iw=W-L-R, ih=H-T-B, x=function(i){return L+iw*i/(n-1);}, y=function(v){return T+ih-((v-minV)/(maxV-minV))*ih;};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria)+'">';
  for(var g=0;g<=4;g++){ var v=minV+(maxV-minV)*g/4; s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+k(v)+'</text>'; }
  var pts=o.vals.map(function(v,i){return x(i)+','+y(v);});
  s+='<polygon points="'+x(0)+','+y(minV)+' '+pts.join(' ')+' '+x(n-1)+','+y(minV)+'" fill="var(--accent)" opacity=".10"/>';
  s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2"/>';
  s+='<circle cx="'+x(n-1)+'" cy="'+y(o.vals[n-1])+'" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>';
  s+='<text x="'+(x(n-1)-8)+'" y="'+(y(o.vals[n-1])-10)+'" text-anchor="end" style="fill:var(--ink);font-weight:600">'+k(o.vals[n-1])+'</text>';
  o.real.forEach(function(v,i){ if(v!=null) s+='<rect x="'+(x(i)-5)+'" y="'+(y(v)-5)+'" width="10" height="10" transform="rotate(45 '+x(i)+' '+y(v)+')" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>'; });
  o.labels.forEach(function(lb,i){ if(i%2===0||i===n-1) s+='<text x="'+x(i)+'" y="'+(H-10)+'" text-anchor="middle">'+lb+'</text>'; s+='<rect data-i="'+i+'" class="hit" x="'+(x(i)-iw/(n-1)/2)+'" y="'+T+'" width="'+(iw/(n-1))+'" height="'+ih+'" fill="transparent"/>'; });
  return s+'</svg>';
}

   '<div class="callout warn"><h4>Como decidir cada requisito</h4><p>Desenvolver quando a demanda é recorrente (3 ou mais casos ou um segmento inteiro da base), o esforço cabe em até 2 trimestres e o requisito destrava contratos já em negociação. Caso isolado vira customização orçada à parte. Requisito que exige reescrever o núcleo do produto fica para 2028.</p></div></div>';

     (afet.length?'<div class="tags">'+afet.map(function(d){return '<span class="tag">'+esc(d.nome)+'</span>';}).join('')+'</div><p class="small"><b>'+brl(mrr)+'</b> de mensalidade no pipeline depende deste requisito</p>':'<p class="small muted">Nenhum negócio do pipeline atual ligado a este requisito.</p>')+'</div>'+
     '<div class="ctl">'+
      '<div class="field"><label for="wm-st-'+g.id+'">Status no produto</label><select id="wm-st-'+g.id+'" data-wms="'+g.id+'" data-f="status"'+dis+'>'+['A avaliar','Atende','Atende em parte','Em desenvolvimento','Não atende'].map(function(o){return '<option'+((w.status||'A avaliar')===o?' selected':'')+'>'+o+'</option>';}).join('')+'</select></div>'+

  });
  h+='</div><p class="small muted">Evidências tiradas dos diagnósticos da Carteira Comercial (posição de 08/10/2026) e da base de leads. As escolhas de status, esforço, prazo e decisão ficam salvas para todos.</p>';
  return h;

   '<li>SDR pleno: R$ 7 a 10 mil com variável; AE de R$ 12 a 25 mil com comissão (<a href="https://jobrise.io/pt/blog/tech-sales-brasil-sdr-ae-vagas/" target="_blank" rel="noopener">Jobrise, 2026</a>).</li>'+
   '<li>Encargos CLT fora do Simples: 1,56× a 1,9× o salário, conforme RAT, terceiros e benefícios (<a href="https://valorfinal.com.br/guia/custo-funcionario" target="_blank" rel="noopener">ValorFinal</a>, <a href="https://www.contabilidadezen.com.br/blog/quanto-custa-funcionario-encargos-2026/" target="_blank" rel="noopener">Contabilidade Zen</a>). O plano usa 1,7×; confirmar com o contador pelo CNAE da Weesu.</li>'+
   '<li>Gerente de canais e parcerias: sem faixa pública confiável para SaaS no Brasil; a base foi alinhada à do executivo de contas sênior.</li></ul></div>';
  h+='<div class="card"><h3>Premissas a validar com dados reais</h3><ul class="small" style="padding-left:18px;display:flex;flex-direction:column;gap:6px">'+
   '<li>Conversões do funil: os 50 clientes atuais vieram de forma orgânica (parceiros e indicação). A prospecção ativa é um canal novo, e as taxas de reunião → venda ('+pct(S.prem.convReuniaoVenda,0)+') e de indicação → venda ('+pct(S.prem.convIndicacao,0)+') são estimativas até o CRM medir.</li>'+

/* ---------- render ---------- */
function render(){
  var M=modelo(), h='';
  if(aba==='resumo') h=secResumo(M); else if(aba==='metas') h=secMetas(M); else if(aba==='investimento') h=secInvest(M);
  else if(aba==='plano') h=secPlano(M); else if(aba==='pipeline') h=secPipeline(M); else if(aba==='acompanhamento') h=secAcomp(M);
  else if(aba==='wms') h=secWms(M); else if(aba==='base') h=secBase(); else { aba=aba==='metodo'?aba:'resumo'; h=aba==='metodo'?secMetodo():secResumo(M); }
  el('main').innerHTML='<div class="wrap">'+h+'<footer>Plano Comercial Weesu · base de leads de 12/10/2026 · pipeline de 08/10/2026 · premissas revisadas mensalmente</footer></div>';
  if(aba==='resumo') afterResumo(M); if(aba==='acompanhamento') afterAcomp(M);
}

/* ---------- interações e gravação ---------- */
function setStatus(id,txt){ var s=el(id); if(s) s.textContent=txt; }
async function salvar(path,data,stId,okTxt){
  if(!S.db){ setStatus(stId,'Sem conexão com o banco do painel: a alteração vale só nesta visita.'); return false; }
  try{ await S.db.doc(path).set(data); if(stId) setStatus(stId,okTxt||'Salvo.'); return true; }
  catch(e){ if(e&&e.code==='invalid_argument'){ S.canWrite=false; setStatus(stId,'Seu acesso a este painel é somente leitura.'); } else setStatus(stId,'Não foi possível salvar agora. Tente de novo em instantes.'); return false; }
}
el('main').addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='mesSel'){ mesSel=t.value; render(); return; }
  if(t.hasAttribute('data-acao')){ var id=t.getAttribute('data-acao'); S.acoes[id]={feito:t.checked}; render(); salvar('acoes/'+id,{feito:t.checked}); return; }
  if(t.hasAttribute('data-pid')){ var pid=t.getAttribute('data-pid'), f=t.getAttribute('data-f'), d=S.pipeline.find(function(x){return x.id===pid;}); if(!d) return;
    var nd=Object.assign({},d); nd[f]= f==='prob'? Math.max(0,Math.min(100,+t.value||0))/100 : t.value; S.pipeline=S.pipeline.map(function(x){return x.id===pid?nd:x;}); render(); var c=Object.assign({},nd); delete c.id; salvar('pipeline/'+pid,c); return; }
  if(t.hasAttribute('data-wms')&&t.tagName==='SELECT'){ wmsSave(t); return; }
});
el('main').addEventListener('focusout',function(e){ var t=e.target; if(t.hasAttribute&&t.hasAttribute('data-wms')&&t.tagName==='TEXTAREA') wmsSave(t); });
function wmsSave(t){ var id=t.getAttribute('data-wms'), f=t.getAttribute('data-f'), w=Object.assign({},S.wms[id]||{}); if(w[f]===t.value) return; w[f]=t.value; S.wms[id]=w; if(t.tagName==='SELECT') render(); salvar('wms/'+id,w); }
el('main').addEventListener('click',function(e){
  var t=e.target;
  if(t.id==='premSalvar'){ var np=Object.assign({},S.prem); document.querySelectorAll('[data-prem]').forEach(function(i){ var v=parseFloat(i.value); if(isNaN(v)) return; np[i.getAttribute('data-prem')]= i.getAttribute('data-t')==='p'? v/100 : v; }); S.prem=np; render(); setStatus('premStatus','Salvando…'); salvar('config/premissas',np,'premStatus','Premissas salvas. O plano foi recalculado.'); }
  if(t.id==='premPadrao'){ S.prem=Object.assign({},DEF); render(); salvar('config/premissas',S.prem,'premStatus','Premissas de volta ao padrão.'); }
  if(t.id==='rzSalvar'){ var r={}; document.querySelectorAll('[data-rz]').forEach(function(i){ if(i.value!=='') r[i.getAttribute('data-rz')]=parseFloat(i.value); }); var nt=el('rz-nota').value; if(nt) r.nota=nt; S.realizado[mesSel]=r; var m=mesSel; render(); setStatus('rzStatus','Salvando…'); salvar('realizado/'+m,r,'rzStatus',ROT[MESES.indexOf(m)]+' salvo.'); }
});

/* ---------- carga ---------- */
renderNav(); render();
(async function(){
  var cl=window.claude; if(!cl||!cl.use){ S.loaded.pipeline=true; render(); return; }
  var db=null,user=null;
  try{ db=await cl.use('db'); }catch(e){}
  try{ user=await cl.use('user'); }catch(e){}
  if(!db){ S.loaded.pipeline=true; render(); return; }
  S.db=db;
  var cw=null; try{ cw=user? await user.can('data.write') : null; }catch(e){}
  S.canWrite = cw!==false;
  var pend=5, first=true;
  function done(){ if(pend>0){ pend--; } render(); }
  db.doc('config/premissas').onSnapshot(function(s){ S.prem=Object.assign({},DEF,s.exists?s.data():{}); done(); },function(){ done(); });
  db.collection('pipeline').onSnapshot(function(s){ S.pipeline=s.docs.map(function(d){ return Object.assign({id:d.id},d.data()); }); S.loaded.pipeline=true; done(); },function(){ S.loaded.pipeline=true; done(); });
  db.collection('realizado').onSnapshot(function(s){ var r={}; s.docs.forEach(function(d){ r[d.id]=d.data(); }); S.realizado=r; done(); },function(){ done(); });
  db.collection('acoes').onSnapshot(function(s){ var r={}; s.docs.forEach(function(d){ r[d.id]=d.data(); }); S.acoes=r; done(); },function(){ done(); });
  db.collection('wms').onSnapshot(function(s){ var r={}; s.docs.forEach(function(d){ r[d.id]=d.data(); }); S.wms=r; done(); },function(){ done(); });
})();
})();
